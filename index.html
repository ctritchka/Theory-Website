<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harmony Practice</title>
    <link rel="stylesheet" href="app.css">
    <script src="curriculum.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <button id="home-button" class="home-button" type="button" hidden>Home</button>
        <div class="header-content">
          <p id="progress" class="progress-label"></p>
          <div class="piece-heading">
            <div class="work-details">
              <h1 id="piece-title">Harmony Practice</h1>
              <p id="piece-composer"></p>
            </div>
            <nav id="phase-progress" aria-label="Current lesson phase"></nav>
          </div>
        </div>
      </header>

      <section id="stage-content" aria-live="polite"></section>
      <p id="status" role="status"></p>
    </main>
  </body>
</html>
